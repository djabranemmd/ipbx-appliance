[general]
static=yes
writeprotect=no

[internal]
; echo test, dial *43 to check your own audio path
exten => *43,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; any number of 3 to 6 digits is dialed as a pjsip extension
exten => _XXX,1,Goto(dial-extension,${EXTEN},1)
exten => _XXXX,1,Goto(dial-extension,${EXTEN},1)
exten => _XXXXX,1,Goto(dial-extension,${EXTEN},1)
exten => _XXXXXX,1,Goto(dial-extension,${EXTEN},1)

[dial-extension]
exten => _X.,1,NoOp(call to ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()