[modules]
autoload=yes

; chan_sip would fight pjsip for port 5060
noload => chan_sip.so

; hardware channels we never use inside a container
noload => chan_dahdi.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => chan_unistim.so

; realtime drivers: we only use odbc, the others fail to connect and spam the log
noload => res_config_pgsql.so
noload => res_config_ldap.so

; backends we do not configure
noload => cdr_pgsql.so
noload => cdr_radius.so
noload => cdr_tds.so
noload => cdr_sqlite3_custom.so
noload => cel_radius.so
noload => cel_tds.so
noload => cel_sqlite3_custom.so
noload => pbx_dundi.so
noload => cel_pgsql.so

; three voicemail variants exist, plain file based one is the one we keep
noload => app_voicemail_odbc.so
noload => app_voicemail_imap.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_geolocation.so
noload => res_pjsip_geolocation.so

; deprecated or useless here
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_adsi.so
noload => app_adsiprog.so
noload => app_getcpeid.so
noload => app_macro.so

load => res_musiconhold.so

[global]