services:
  db:
    image: postgres:16-alpine
    container_name: pbx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    # published on localhost only (psql, migrations, backend in dev).
    # asterisk reaches the database through the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  asterisk:
    build: ./asterisk
    container_name: pbx-asterisk
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PBX_EXTERNAL_IP: ${PBX_EXTERNAL_IP:?set PBX_EXTERNAL_IP in .env}
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core waitfullybooted'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db_data: